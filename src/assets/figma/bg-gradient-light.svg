<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="2260" height="1760" viewBox="0 0 2260 1760" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- 밝은 극야: bg-gradient.svg와 같은 캔버스에 하늘 위쪽을 가로지르는 옅은 오로라 -->
<g id="aurora">
<ellipse cx="900" cy="620" rx="620" ry="190" fill="#96E1CD" fill-opacity="0.42" filter="url(#blur-lg)"/>
<ellipse cx="1500" cy="680" rx="460" ry="210" fill="#AAA0F0" fill-opacity="0.3" filter="url(#blur-lg)"/>
<ellipse cx="1180" cy="900" rx="420" ry="180" fill="#9DD5E8" fill-opacity="0.18" filter="url(#blur-md)"/>
</g>
<defs>
<filter id="blur-lg" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="110"/>
</filter>
<filter id="blur-md" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
<feGaussianBlur stdDeviation="90"/>
</filter>
</defs>
</svg>
